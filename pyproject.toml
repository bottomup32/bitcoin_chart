[project]
name = "quant-pm"
version = "0.1.0"
description = "Personal multi-agent quant portfolio advisor (informational only, not investment advice)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pandas>=2.1",
    "pandas-market-calendars>=4.3",
    "yfinance==0.2.65",
    "requests>=2.31",
    "python-dateutil>=2.8",
    "anthropic>=0.70",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 실질적 버그(E4/E7/E9, F)와 import 정렬(I)만 강제한다.
# 줄 길이(E501)·포매팅은 기존 코드 스타일을 존중해 강제하지 않는다.
select = ["E4", "E7", "E9", "F", "I"]
